name: Test iPhone 13 TrueDepth orientation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/truedepth-orientation-iphone13
    paths:
      - '.github/workflows/test-iphone13-orientation.yml'
      - 'StandardCyborgFusion/Sources/StandardCyborgFusion/Helpers/PerspectiveCamera+AVFoundation.mm'

jobs:
  build-orientation-test:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build StandardCyborgExample
        run: |
          xcodebuild \
            -project StandardCyborgExample/StandardCyborgExample.xcodeproj \
            -scheme StandardCyborgExample \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-example \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package StandardCyborgExample IPA
        run: |
          APP="build-example/Build/Products/Release-iphoneos/StandardCyborgExample.app"
          PKG="build-example/Build/Products/Release-iphoneos/PackageFrameworks"
          for NAME in StandardCyborgUI StandardCyborgFusion; do
            DEST="$APP/Frameworks/$NAME.framework"
            if [ ! -f "$DEST/$NAME" ]; then
              test -d "$PKG/$NAME.framework"
              mkdir -p "$APP/Frameworks"
              cp -R "$PKG/$NAME.framework" "$DEST"
            fi
            test -f "$DEST/$NAME"
          done
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ereminde.sc.orientation.example" "$APP/Info.plist"
          echo "App identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          mkdir -p orientation-example/Payload
          cp -R "$APP" orientation-example/Payload/
          (cd orientation-example && zip -qr StandardCyborgExample-OrientationTest.ipa Payload)

      - name: Build TrueDepthFusion
        run: |
          xcodebuild \
            -project StandardCyborgSDK.xcodeproj \
            -scheme TrueDepthFusion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-full \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package TrueDepthFusion IPA
        run: |
          APP="build-full/Build/Products/Release-iphoneos/TrueDepthFusion.app"
          PKG="build-full/Build/Products/Release-iphoneos/PackageFrameworks"
          DEST="$APP/Frameworks/StandardCyborgFusion.framework"
          if [ ! -f "$DEST/StandardCyborgFusion" ]; then
            test -d "$PKG/StandardCyborgFusion.framework"
            mkdir -p "$APP/Frameworks"
            cp -R "$PKG/StandardCyborgFusion.framework" "$DEST"
          fi
          test -f "$DEST/StandardCyborgFusion"
          test -f "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.ereminde.sc.orientation.full" "$APP/Info.plist"
          echo "App identifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          mkdir -p orientation-full/Payload
          cp -R "$APP" orientation-full/Payload/
          (cd orientation-full && zip -qr TrueDepthFusion-OrientationTest.ipa Payload)

      - name: Validate unique bundle identifiers in both IPAs
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile
          from pathlib import PurePosixPath

          archives = {
              "orientation-example/StandardCyborgExample-OrientationTest.ipa": "com.ereminde.sc.orientation.example",
              "orientation-full/TrueDepthFusion-OrientationTest.ipa": "com.ereminde.sc.orientation.full",
          }
          for filename, expected_app_id in archives.items():
              found = {}
              with zipfile.ZipFile(filename) as zf:
                  for member in zf.namelist():
                      if not member.startswith("Payload/") or not member.endswith("/Info.plist"):
                          continue
                      info = plistlib.loads(zf.read(member))
                      bundle_id = info.get("CFBundleIdentifier")
                      if not bundle_id:
                          continue
                      if bundle_id in found:
                          raise RuntimeError(
                              f"Duplicate Bundle ID {bundle_id}: {found[bundle_id]} and {member} in {filename}"
                          )
                      found[bundle_id] = member
                  if expected_app_id not in found:
                      raise RuntimeError(f"Top-level app Bundle ID {expected_app_id} not found in {filename}")
              print(f"{filename}: {len(found)} unique bundle identifiers")
          PY

      - name: Upload orientation test IPAs
        uses: actions/upload-artifact@v4
        with:
          name: iphone13-orientation-test-ipas
          path: |
            orientation-example/StandardCyborgExample-OrientationTest.ipa
            orientation-full/TrueDepthFusion-OrientationTest.ipa
          if-no-files-found: error
