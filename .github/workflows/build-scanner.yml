
name: Build iPhone Scanner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project StandardCyborgExample/StandardCyborgExample.xcodeproj \
            -scheme StandardCyborgExample \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed missing runtime framework
        run: |
          APP="build/Build/Products/Release-iphoneos/StandardCyborgExample.app"
          PACKAGES="build/Build/Products/Release-iphoneos/PackageFrameworks"
          mkdir -p "$APP/Frameworks"

          for FRAMEWORK in StandardCyborgUI StandardCyborgFusion; do
            SOURCE="$PACKAGES/$FRAMEWORK.framework"
            DEST="$APP/Frameworks/$FRAMEWORK.framework"
            if [ ! -d "$SOURCE" ]; then
              echo "::error::Missing built framework: $SOURCE"
              exit 1
            fi
            if [ ! -d "$DEST" ]; then
              cp -R "$SOURCE" "$DEST"
            fi
            if [ ! -f "$DEST/$FRAMEWORK" ]; then
              echo "::error::Missing executable in $DEST"
              exit 1
            fi
            echo "Embedded $FRAMEWORK"
          done

          ls -la "$APP/Frameworks"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StandardCyborgExample.app Payload/
          zip -qr StandardCyborgExample.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-scanner
          path: StandardCyborgExample.ipa
