
name: Build iPhone Scanner

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project StandardCyborgExample/StandardCyborgExample.xcodeproj \
            -scheme StandardCyborgExample \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StandardCyborgExample.app Payload/
          zip -qr StandardCyborgExample.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-scanner
          path: StandardCyborgExample.ipa
